[platformio]
; plain build/upload only builds the board; native is for `pio test -e native`
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[env:native]
platform = native
test_framework = unity
; link src/*.cpp into native tests (main.cpp is guarded by PIO_UNIT_TESTING)
test_build_src = true
